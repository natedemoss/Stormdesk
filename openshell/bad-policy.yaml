# DEMO ONLY: what a careless "just let the agent text people" change would look like.
# Same as policy.yaml plus one rule that lets Python POST to an SMS gateway.
# The prover rejects it against boundary.yaml, which is the point of the demo:
#   openshell-prover check openshell/bad-policy.yaml --boundary openshell/boundary.yaml
# Never pass this file to `openshell sandbox create`.

version: 1

filesystem_policy:
  include_workdir: false
  read_only: [/usr, /lib, /etc, /app, /var/log, /proc]
  read_write: [/tmp]

landlock:
  compatibility: hard_requirement

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  local_vllm:
    endpoints:
      - host: host.openshell.internal
        ports: [8000, 8001]
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
          - allow:
              method: GET
              path: /v1/models
    binaries:
      - path: /usr/local/bin/python3.12
  sms_gateway:
    endpoints:
      - host: api.twilio.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /usr/local/bin/python3.12
