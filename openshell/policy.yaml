# StormDesk agent sandbox policy (OpenShell policy schema, version 1).
#
# Written against the OpenShell docs at commit d8a613f (docs/how-it-works/policies/schema.mdx).
# Check it on the Brev box before the demo:
#   openshell-prover check openshell/policy.yaml --boundary openshell/boundary.yaml
#
# What this allows, in plain words:
#   - read the app code and cached data baked into the image (/app)
#   - write only to /tmp (the incident database lives there)
#   - talk to exactly two endpoints: the local vLLM servers on the host,
#     and only the OpenAI-style chat and model-list routes
# Everything else is denied: no internet, no SMS or email gateways, no webhooks,
# no reading home directories or keys. Denials show up in `openshell logs`.

version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /etc
    - /app        # StormDesk code + cached NCDOT / NWS / OSM data
    - /var/log    # lets the console show OpenShell's own audit log
    - /proc
  read_write:
    - /tmp        # incident DB and dispatch drafts

landlock:
  compatibility: hard_requirement   # refuse to start rather than run without file rules

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  local_vllm:
    name: local vLLM (Lightning :8000, triage :8001)
    endpoints:
      # Host-local services are reached through host.openshell.internal,
      # never 127.0.0.1 (the docs say loopback is never authorized).
      - host: host.openshell.internal
        ports: [8000, 8001]
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
          - allow:
              method: GET
              path: /v1/models
    binaries:
      - path: /usr/local/bin/python3.12
