stormdesk_dispatch_resources_server:
  resources_servers:
    stormdesk_dispatch:
      entrypoint: app.py
      domain: agent
      verified: false
      description: Disaster dispatch tool calling with offline NC data; rewards safe declines on vague, noise and injected reports
      use_guard: true
stormdesk_dispatch_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 12
      resources_server:
        type: resources_servers
        name: stormdesk_dispatch_resources_server
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: validation
        type: validation
        jsonl_fpath: resources_servers/stormdesk_dispatch/data/validation.jsonl
        license: MIT
      - name: example
        type: example
        jsonl_fpath: resources_servers/stormdesk_dispatch/data/example.jsonl
        license: MIT

stormdesk_dispatch_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: stormdesk_dispatch_simple_agent
